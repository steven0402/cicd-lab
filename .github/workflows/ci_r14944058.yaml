name: CI r14944058

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  ci:
    name: Typecheck, format, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts" "package.json" ".github/workflows/ci_r14944058.yaml"

      - name: Run tests with JUnit report
        run: npm run test:ci

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always() && hashFiles('reports/junit.xml') != ''
        with:
          name: Vitest Test Results
          path: reports/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('reports/junit.xml') != ''
        with:
          name: vitest-junit-report
          path: reports/junit.xml
